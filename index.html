<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3AMAK TRADES — تعلم التداول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #D4AF37;
      --green-dim: #B8960C;
      --green-glow: rgba(212,175,55,0.4);
      --dark: #050505;
      --dark-2: #0a0a0a;
      --dark-3: #111;
      --dark-4: #181818;
      --white: #ffffff;
      --gray: #777;
      --red: #ef4444;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--white);
      overflow-x: hidden;
    }

    /* Font switching based on lang */
    html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
    html[lang="en"] body { font-family: 'Inter', system-ui, sans-serif; }

    /* ══ TICKER ══ */
    .ticker {
      background: var(--green);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 8px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-inner {
      display: inline-flex;
      animation: ticker 30s linear infinite;
    }
    .ticker-item { padding: 0 28px; display: inline-flex; align-items: center; gap: 8px; }
    .ticker-item .dot { width: 5px; height: 5px; border-radius: 50%; background: #000; opacity: 0.4; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ══ NAV ══ */
    nav {
      position: sticky; top: 0; z-index: 99;
      background: rgba(5,5,5,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo-img { height: 56px; width: auto; object-fit: contain; }
    .foot-logo-img { height: 48px; width: auto; object-fit: contain; opacity: 0.85; }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    /* Language toggle */
    .lang-toggle {
      display: flex;
      background: var(--dark-3);
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
    }
    .lang-btn {
      padding: 7px 14px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--gray);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }
    .lang-btn.active { background: var(--green); color: #000; }
    .lang-btn:hover:not(.active) { color: var(--white); }

    .nav-cta {
      background: var(--green); color: #000;
      font-size: 12px; font-weight: 800;
      letter-spacing: 0.5px;
      padding: 9px 20px; border-radius: 6px;
      text-decoration: none; transition: opacity 0.15s;
    }
    .nav-cta:hover { opacity: 0.85; }

    /* ══ HERO ══ */
    #hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 80px 20px 60px;
      overflow: hidden;
    }
    #hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(212,175,55,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,175,55,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridScroll 20s linear infinite;
    }
    @keyframes gridScroll { from { background-position: 0 0; } to { background-position: 0 60px; } }
    #hero::after {
      content: ''; position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(212,175,55,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; max-width: 820px; }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.25);
      border-radius: 30px; padding: 7px 18px;
      font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 28px;
    }
    .pulse {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 0 var(--green-glow);
      animation: pulse 2s infinite; flex-shrink: 0;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 var(--green-glow); }
      70%  { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .hero-headline {
      font-size: clamp(36px, 6vw, 68px); font-weight: 900;
      line-height: 1.1; letter-spacing: -1px; margin-bottom: 24px;
    }
    html[lang="ar"] .hero-headline { letter-spacing: 0; line-height: 1.2; }
    .hero-headline .g { color: var(--green); display: block; }

    .hero-sub {
      font-size: clamp(15px, 2vw, 18px); color: var(--gray);
      max-width: 560px; line-height: 1.7; margin: 0 auto 36px;
    }
    html[lang="ar"] .hero-sub { line-height: 1.9; }

    .hero-pills {
      display: flex; gap: 10px; justify-content: center;
      flex-wrap: wrap; margin-bottom: 44px;
    }
    .hero-pills span {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px; padding: 7px 16px;
      font-size: 13px; color: #ccc;
    }
    .hero-pills span::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--green); flex-shrink: 0;
    }

    .hero-video { width: 100%; max-width: 720px; margin: 0 auto 48px; }

    /* animated chart */
    .hero-chart {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 180px; z-index: 1; pointer-events: none; opacity: 0.15;
    }
    .hero-chart svg { width: 100%; height: 100%; }
    .chart-path {
      stroke-dasharray: 2000; stroke-dashoffset: 2000;
      animation: drawChart 4s ease forwards 0.5s;
    }
    @keyframes drawChart { to { stroke-dashoffset: 0; } }

    /* ══ CTA BTN ══ */
    .cta-btn {
      display: inline-flex; flex-direction: column; align-items: center;
      background: var(--green); color: #000; text-decoration: none;
      border: none; cursor: pointer; border-radius: 8px;
      padding: 16px 44px; font-weight: 800; font-size: 14px;
      letter-spacing: 0.5px; text-transform: uppercase;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      position: relative; overflow: hidden;
      font-family: inherit;
    }
    html[lang="ar"] .cta-btn { text-transform: none; font-size: 16px; letter-spacing: 0; }
    .cta-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
    }
    .cta-btn .sub { font-size: 11px; font-weight: 600; opacity: 0.65; margin-top: 3px; }
    .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px var(--green-glow); background: #e6c346; }

    /* ══ SHARED ══ */
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
    .section-label {
      display: inline-block;
      background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.2);
      color: var(--green); font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 5px 14px; border-radius: 20px; margin-bottom: 16px;
    }
    html[lang="ar"] .section-label { letter-spacing: 0; font-size: 12px; text-transform: none; }
    .section-header { text-align: center; margin-bottom: 52px; }
    .section-header h2 {
      font-size: clamp(26px, 4vw, 42px); font-weight: 900;
      letter-spacing: -1px; line-height: 1.1;
    }
    html[lang="ar"] .section-header h2 { letter-spacing: 0; line-height: 1.3; }
    .section-header h2 .g { color: var(--green); }

    /* ══ VSL ══ */
    #vsl {
      padding: 80px 20px; background: var(--dark-2);
      position: relative; overflow: hidden;
    }
    #vsl::before {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
    }
    .vsl-wrapper { max-width: 780px; margin: 0 auto; }
    .vsl-label { text-align: center; margin-bottom: 28px; }
    .video-container {
      position: relative; width: 100%; padding-bottom: 56.25%;
      background: #000; border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(212,175,55,0.15), 0 40px 80px rgba(0,0,0,0.7);
    }
    .video-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #050505; gap: 20px;
    }
    .fake-chart { position: absolute; inset: 0; opacity: 0.07; }
    .fake-chart svg { width: 100%; height: 100%; }
    .play-btn {
      width: 80px; height: 80px; border-radius: 50%; background: var(--green);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 0 60px var(--green-glow);
      transition: transform 0.2s, box-shadow 0.2s; position: relative; z-index: 1;
    }
    .play-btn::before {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.3); animation: ripple 2s linear infinite;
    }
    .play-btn::after {
      content: ''; position: absolute; inset: -16px; border-radius: 50%;
      border: 1px solid rgba(212,175,55,0.15); animation: ripple 2s linear infinite 0.5s;
    }
    @keyframes ripple { 0% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.5); } }
    .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 80px var(--green-glow); }
    .play-btn svg { margin-left: 5px; }
    html[lang="ar"] .play-btn svg { margin-left: 0; margin-right: 5px; }
    .vsl-sub { text-align: center; margin-top: 20px; font-size: 13px; color: var(--gray); }
    .vsl-cta { text-align: center; margin-top: 40px; }

    /* ══ STATS ══ */
    #stats {
      background: var(--dark-3);
      border-top: 1px solid #1a1a1a; border-bottom: 1px solid #1a1a1a;
    }
    .stats-grid {
      max-width: 900px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr);
    }
    .stat-item { padding: 44px 20px; text-align: center; position: relative; }
    .stat-item + .stat-item::before {
      content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 1px; background: #1e1e1e;
    }
    html[lang="ar"] .stat-item + .stat-item::before { left: auto; right: 0; }
    .stat-number {
      font-size: 48px; font-weight: 900; color: var(--green); line-height: 1;
      margin-bottom: 8px; letter-spacing: -2px;
      text-shadow: 0 0 30px rgba(212,175,55,0.4);
    }
    html[lang="ar"] .stat-number { font-family: 'Inter', sans-serif; }
    .stat-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
    html[lang="ar"] .stat-label { text-transform: none; letter-spacing: 0; font-size: 13px; }

    /* ══ PROOF ══ */
    #proof { padding: 100px 20px; background: var(--dark); }
    .proof-grid {
      max-width: 880px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .proof-card {
      background: var(--dark-3); border: 1px solid #1e1e1e;
      border-radius: 12px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .proof-card:hover {
      transform: translateY(-4px); border-color: rgba(212,175,55,0.3);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .proof-thumb { position: relative; width: 100%; padding-bottom: 56.25%; background: #0a0a0a; }
    .proof-thumb-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #080808, #141414);
    }
    .small-play {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(212,175,55,0.1); border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .proof-card:hover .small-play { background: var(--green); }
    .proof-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      padding: 12px 12px 10px;
    }
    .proof-tag {
      display: inline-block; background: var(--green); color: #000;
      font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 3px;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px;
    }
    html[lang="ar"] .proof-tag { text-transform: none; letter-spacing: 0; font-size: 10px; }
    .proof-title { font-size: 13px; font-weight: 700; line-height: 1.35; }

    /* ══ APPLY ══ */
    #apply {
      padding: 100px 20px; background: var(--dark-2);
      position: relative; overflow: hidden;
    }
    #apply::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(212,175,55,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .apply-wrapper { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
    .apply-header { text-align: center; margin-bottom: 44px; }
    .apply-header h2 {
      font-size: clamp(28px, 4vw, 44px); font-weight: 900;
      line-height: 1.15; letter-spacing: -1px; margin-bottom: 14px;
    }
    html[lang="ar"] .apply-header h2 { letter-spacing: 0; line-height: 1.3; }
    .apply-header p { color: var(--gray); font-size: 15px; line-height: 1.7; }

    /* ══ FORM ══ */
    .form-box {
      background: var(--dark-3); border: 1px solid #1e1e1e;
      border-radius: 16px; overflow: hidden;
      position: relative;
    }
    .form-box::before {
      content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      z-index: 1;
    }

    /* progress bar */
    .form-progress {
      height: 3px; background: #1a1a1a; position: relative;
    }
    .form-progress-fill {
      height: 100%; background: var(--green);
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--green-glow);
    }

    /* step counter */
    .form-step-counter {
      padding: 18px 28px 0;
      font-size: 11px; color: var(--gray); letter-spacing: 1px;
      text-transform: uppercase; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    html[lang="ar"] .form-step-counter { text-transform: none; letter-spacing: 0; }

    /* steps wrapper */
    .form-steps { position: relative; min-height: 320px; }

    /* individual step */
    .form-step {
      padding: 32px 28px 28px;
      display: none;
      animation: stepIn 0.3s ease;
    }
    .form-step.active { display: block; }
    @keyframes stepIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .form-step h3 {
      font-size: clamp(18px, 3vw, 22px); font-weight: 800;
      margin-bottom: 24px; line-height: 1.3;
    }
    html[lang="ar"] .form-step h3 { font-size: clamp(18px, 3vw, 22px); }
    .form-step h3 .step-num {
      color: var(--green); font-size: 13px; font-weight: 700;
      display: block; margin-bottom: 6px; letter-spacing: 1px;
    }
    html[lang="ar"] .form-step h3 .step-num { letter-spacing: 0; }

    /* text input */
    .form-input {
      width: 100%; background: transparent;
      border: none; border-bottom: 2px solid #2a2a2a;
      color: var(--white); font-size: 20px; font-weight: 600;
      padding: 10px 0; outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--green); }
    .form-input::placeholder { color: #333; }

    /* choices */
    .form-choices { display: flex; flex-direction: column; gap: 10px; }
    .form-choice {
      display: flex; align-items: center; gap: 14px;
      background: var(--dark-4); border: 1px solid #222;
      border-radius: 10px; padding: 14px 18px;
      cursor: pointer; transition: all 0.15s;
      font-size: 15px; font-weight: 600;
      user-select: none;
    }
    html[lang="ar"] .form-choice { font-size: 15px; }
    .form-choice:hover { border-color: rgba(212,175,55,0.3); background: rgba(212,175,55,0.04); }
    .form-choice.selected { border-color: var(--green); background: rgba(212,175,55,0.08); color: var(--green); }
    .choice-key {
      width: 28px; height: 28px; border-radius: 6px;
      background: #1a1a1a; border: 1px solid #333;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--gray);
      flex-shrink: 0; font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    .form-choice.selected .choice-key { background: var(--green); border-color: var(--green); color: #000; }

    /* nav buttons */
    .form-nav {
      padding: 0 28px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .form-btn-next {
      background: var(--green); color: #000;
      border: none; border-radius: 8px;
      padding: 13px 32px; font-size: 14px; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: opacity 0.15s, transform 0.15s;
      display: flex; align-items: center; gap: 8px;
      margin-inline-start: auto;
    }
    .form-btn-next:hover { opacity: 0.88; transform: translateY(-1px); }
    .form-btn-next:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .form-btn-back {
      background: transparent; color: var(--gray);
      border: 1px solid #222; border-radius: 8px;
      padding: 13px 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .form-btn-back:hover { color: var(--white); border-color: #444; }

    /* confirmation screen */
    .form-confirm {
      padding: 52px 28px;
      text-align: center; display: none;
    }
    .form-confirm.active { display: block; animation: stepIn 0.4s ease; }
    .confirm-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(212,175,55,0.1); border: 2px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 30px;
      box-shadow: 0 0 30px var(--green-glow);
    }
    .form-confirm h3 { font-size: 24px; font-weight: 900; margin-bottom: 12px; }
    .form-confirm p { color: var(--gray); font-size: 15px; line-height: 1.7; }

    /* ══ MENTOR ══ */
    #mentor { padding: 100px 20px; background: var(--dark); }
    .mentor-grid {
      max-width: 820px; margin: 52px auto 0;
      display: grid; grid-template-columns: 260px 1fr;
      gap: 56px; align-items: start;
    }
    html[lang="ar"] .mentor-grid { direction: rtl; }
    .mentor-photo {
      aspect-ratio: 3/4; background: var(--dark-3);
      border-radius: 16px; border: 1px solid #1e1e1e; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray); font-size: 13px; text-align: center; position: relative;
    }
    .mentor-photo::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: var(--green); opacity: 0.5;
    }
    .mentor-tag { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 10px; }
    html[lang="ar"] .mentor-tag { text-transform: none; letter-spacing: 0; font-size: 13px; }
    .mentor-name { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
    .mentor-title { font-size: 13px; color: var(--gray); margin-bottom: 24px; }
    .mentor-stats { display: flex; gap: 20px; margin-bottom: 28px; }
    .mstat {
      background: var(--dark-3); border: 1px solid #1e1e1e;
      border-radius: 8px; padding: 12px 16px; text-align: center; flex: 1;
    }
    .mstat-num { font-size: 20px; font-weight: 900; color: var(--green); font-family: 'Inter', sans-serif; }
    .mstat-lbl { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    html[lang="ar"] .mstat-lbl { text-transform: none; letter-spacing: 0; font-size: 11px; }
    .mentor-bio p { color: #aaa; font-size: 14px; line-height: 1.85; margin-bottom: 12px; }
    html[lang="ar"] .mentor-bio p { line-height: 2; font-size: 15px; }

    /* ══ DECIDE ══ */
    #decide { padding: 100px 20px; background: var(--dark-2); }
    .decide-grid {
      max-width: 820px; margin: 52px auto 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .decide-card { border-radius: 14px; padding: 32px 28px; border: 1px solid #1e1e1e; }
    .decide-card.bad { background: rgba(239,68,68,0.03); border-color: rgba(239,68,68,0.15); }
    .decide-card.good { background: rgba(212,175,55,0.03); border-color: rgba(212,175,55,0.2); box-shadow: 0 0 40px rgba(212,175,55,0.05); }
    .decide-card-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }

<script>
  // ── FORM STATE ──
  const TOTAL_STEPS = 11;
  let partialTimer = null;
  let currentStep = 1;
  const answers = {};

  function formRenderText() {
    // step counter
    document.getElementById('stepCounterText').textContent = txt('step_label');
    document.getElementById('stepCounterFrac').textContent = `${currentStep} / ${TOTAL_STEPS}`;
    // progress
    document.getElementById('formProgress').style.width = `${(currentStep / TOTAL_STEPS) * 100}%`;
    // all step-num labels
    document.querySelectorAll('.form-step .step-num').forEach(el => {
      el.textContent = `${txt('step_label')} ${el.closest('.form-step').dataset.step} —`;
    });
    // all question text
    document.querySelectorAll('[data-key]').forEach(el => {
      const k = el.dataset.key;
      if (t[lang][k] !== undefined) el.textContent = t[lang][k];
    });
    // placeholders
    document.querySelectorAll('[data-placeholder-key]').forEach(el => {
      el.placeholder = txt(el.dataset.placeholderKey);
    });
    // back button visibility
    const backBtn = document.getElementById('formBack');
    backBtn.style.visibility = currentStep > 1 ? 'visible' : 'hidden';
    // next button arrow direction
    const arrow = currentStep === TOTAL_STEPS ? '✓' : (lang === 'ar' ? '←' : '→');
    document.querySelector('#formNext span:last-child').textContent = arrow;
  }

  function showStep(n) {
    document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
    const target = document.querySelector(`.form-step[data-step="${n}"]`);
    if (target) target.classList.add('active');
    currentStep = n;
    formRenderText();
    const input = target && target.querySelector('.form-input');
    if (input) setTimeout(() => input.focus(), 50);
  }

  function isStepValid() {
    const step = document.querySelector(`.form-step[data-step="${currentStep}"]`);
    const input = step.querySelector('.form-input');
    if (input) return input.value.trim().length > 0;
    return !!answers[`q${currentStep}`];
  }

  function formNext() {
    if (!isStepValid()) {
      // shake the active step
      const step = document.querySelector('.form-step.active');
      step.style.animation = 'none';
      step.offsetHeight;
      step.style.animation = 'shake 0.3s ease';
      return;
    }
    // save text inputs
    const input = document.querySelector(`.form-step[data-step="${currentStep}"] .form-input`);
    if (input) answers[`q${currentStep}`] = input.value.trim();

    // after email step, store partial data so it can be sent on page leave
    if (currentStep === 4) {
      partialTimer = true; // flag that contact info has been captured
    }

    if (currentStep === TOTAL_STEPS) {
      submitForm();
      return;
    }
    showStep(currentStep + 1);
  }

  function formPrev() {
    if (currentStep > 1) showStep(currentStep - 1);
  }

  // choice selection
  document.addEventListener('click', e => {
    const choice = e.target.closest('.form-choice');
    if (!choice) return;
    const group = choice.closest('.form-choices');
    group.querySelectorAll('.form-choice').forEach(c => c.classList.remove('selected'));
    choice.classList.add('selected');
    answers[`q${currentStep}`] = choice.dataset.value;
  });

  // enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') formNext();
  });

  async function submitForm() {
    if (partialTimer) { clearTimeout(partialTimer); partialTimer = null; }
    document.getElementById('formNav').style.display = 'none';
    document.querySelector('.form-steps').style.display = 'none';
    document.querySelector('.form-step-counter').style.display = 'none';
    document.getElementById('formProgress').style.width = '100%';
    document.getElementById('formConfirm').classList.add('active');
    formRenderText();

    // map answer values to readable labels for Slack
    // step order: 1=name,2=age,3=phone,4=email,5=country,6=occupation,7=experience,8=hours,9=budget,10=looking,11=goal
    const occupationMap = { student: txt('q4_a'), employed: txt('q4_b'), 'self-employed': txt('q4_c'), unemployed: txt('q4_d'), other: txt('q4_e') };
    const expMap        = { beginner: txt('q5_a'), 'tried-lost': txt('q5_b'), 'some-exp': txt('q5_c') };
    const hoursMap      = { '<1h': txt('q6_a'), '1-2h': txt('q6_b'), '3h+': txt('q6_c') };
    const budgetMap     = { '<500': txt('q7_a'), '500-1k': txt('q7_b'), '1k-3k': txt('q7_c'), '3k+': txt('q7_d') };
    const lookingMap    = { videos: txt('q8_a'), community: txt('q8_b'), '1on1': txt('q8_c'), all: txt('q8_d') };
    const goalMap       = { 'side-income': txt('q9_a'), 'replace-income': txt('q9_b'), 'full-time': txt('q9_c') };

    const payload = {
      name:       answers.q1  || '—',
      age:        answers.q2  || '—',
      phone:      answers.q3  || '—',
      email:      answers.q4  || '—',
      country:    answers.q5  || '—',
      occupation: occupationMap[answers.q6]  || answers.q6  || '—',
      experience: expMap[answers.q7]         || answers.q7  || '—',
      hours:      hoursMap[answers.q8]       || answers.q8  || '—',
      budget:     budgetMap[answers.q9]      || answers.q9  || '—',
      looking:    lookingMap[answers.q10]    || answers.q10 || '—',
      goal:       goalMap[answers.q11]       || answers.q11 || '—',
      lang:       lang === 'ar' ? 'Arabic' : 'English',
    };

    try {
      await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch(e) { /* silent fail — confirmation still shown */ }
  }

  // shake animation
  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = '@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }';
  document.head.appendChild(shakeStyle);

  // ── INIT ──
  document.addEventListener('DOMContentLoaded', () => {
    render();
    formRenderText();

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), i * 80);
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up:not(.visible)').forEach(el => observer.observe(el));
  });

  // re-render form text on lang switch
  const _origSetLang = setLang;
  setLang = function(l) { _origSetLang(l); formRenderText(); };

  // send partial lead if they leave after giving contact info but before finishing
  window.addEventListener('pagehide', () => {
    if (!partialTimer) return;
    const data = {
      name: answers.q1 || '—', age: answers.q2 || '—',
      phone: answers.q3 || '—', email: answers.q4 || '—',
      country: '—', occupation: '—', experience: '—',
      hours: '—', budget: '—', looking: '—', goal: '—',
      lang: lang === 'ar' ? 'Arabic' : 'English',
      partial: true,
    };
    navigator.sendBeacon('/api/submit', new Blob([JSON.stringify(data)], { type: 'application/json' }));
  });
</script>
